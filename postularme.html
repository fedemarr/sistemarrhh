<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postulación — Sistema RRHH</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <main id="screen-postular" class="postular-wrap">
    <div class="login-card" style="max-width:720px">
      <div class="logo">R</div>
      <h1>Postulación laboral</h1>
      <p class="sub">Completá el formulario y tu candidatura queda registrada.</p>
      <form id="form-postular">
        <div id="postular-err" class="login-err"></div>
        <div class="form-grid">
          <div class="field"><label>Nombre *</label><input name="nombre" required /></div>
          <div class="field"><label>Apellido *</label><input name="apellido" required /></div>
          <div class="field"><label>DNI *</label><input name="dni" inputmode="numeric" required /></div>
          <div class="field"><label>Email</label><input type="email" name="email" /></div>
          <div class="field"><label>Teléfono</label><input name="telefono" /></div>
          <div class="field"><label>Fecha de nacimiento</label><input type="date" name="fechaNacimiento" /></div>
          <div class="field"><label>Servicio deseado</label><input name="servicioDeseado" /></div>
          <div class="field"><label>Disponibilidad</label><select name="disponibilidad"><option>Full time</option><option>Part time</option><option>Solo mañanas</option><option>Solo tardes</option></select></div>
          <div class="field full"><label>Experiencia</label><textarea name="experiencia" rows="3"></textarea></div>
        </div>
        <button type="submit" class="btn">Enviar postulación</button>
      </form>
      <p class="muted" style="text-align:center;margin-top:12px"><a href="/">← Volver al inicio</a></p>
    </div>
  </main>
  <script type="module" src="/src/postular.js"></script>
</body>
</html>
